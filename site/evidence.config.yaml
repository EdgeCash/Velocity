# Velocity — the trading-desk theme.
#
# Dark only, on purpose. This is a board you read at night and on a phone at
# the sportsbook; a light mode would be a second design to keep honest for no
# one. The switcher is off and every surface below is picked for the dark
# ground.
#
# Chart marks are stepped into the dark band (OKLCH L 0.48–0.67) rather than
# reusing the brighter UI accents — a #3ddad0 line on a near-black ground
# glares. The categorical palette is the validated eight-hue order (adjacent
# CVD ΔE ≥ 8); single-series charts take the brand teal directly and skip the
# palette entirely. Profit green and loss red are STATUS colors, not
# categorical slots: they are indistinguishable under deuteranopia, so every
# number that wears them also carries a sign or an arrow, never color alone.
#
# `negative` is salmon, not red. It is the loss half of the money axis and it
# sits beside a positive on nearly every row; a fire-alarm red there makes an
# ordinary losing market look like a fault. True red (#e5484d) is spent on the
# kill switch alone, which is why it is not in this palette.
appearance:
  default: dark
  switcher: false

theme:
  colors:
    # The ground and its elevations. base-100 is also the chart canvas.
    base: "#06090d"
    base-200: "#101822"
    base-300: "#26333f"
    base-content: "#e9f1f9"
    base-content-muted: "#8fa0b3"
    base-heading: "#f2f7fb"
    # Brand teal: the model's own color, used for accents and single series.
    primary: "#3ddad0"
    primary-content: "#04100f"
    accent: "#f5b342"
    accent-content: "#170f02"
    info: "#5b8dff"
    # Money. Always paired with a sign or arrow — see the note above.
    positive: "#35d07f"
    negative: "#f97289"
    warning: "#f5b342"
  colorPalettes:
    # The validated dark categorical order, for the rare chart that must tell
    # series apart. Assigned in fixed order, never cycled.
    default:
      - "#3987e5"
      - "#d95926"
      - "#199e70"
      - "#c98500"
      - "#d55181"
      - "#008300"
  colorScales:
    # Sequential: one hue, dark → bright.
    default:
      - "#0b2a28"
      - "#3ddad0"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/duckdb": {}
