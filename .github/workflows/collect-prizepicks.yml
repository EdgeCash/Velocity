name: Collect PrizePicks board

# PrizePicks has no historical archive — a board line exists only while it is
# live — so pick'em history has to be built by snapshotting the board. Nothing
# is committed: ToS hygiene and our own edge both say board snapshots never
# land in git. The feed is keyless; the collector is deliberately polite (one
# request per league, spaced, backoff) and reports bot-protection blocks
# instead of fighting them.
#
# THE SCHEDULE IS OFF (2026-09-15). It ran every 3 hours for 180 runs and
# banked nothing: DataDome refuses GitHub's datacenter IPs, so every run logs
#
#   PrizePicks board unreachable from this network (HTTP Error 403: Forbidden)
#   skipping snapshot (bot-protection block — expected from datacenter IPs)
#
# and exits green, by design — a known block is a clean skip so the schedule
# survives. That was the right call when the block might have been transient.
# It is not transient, and a green run that collects nothing is indistinguishable
# from a working one at a glance, which is the worst shape for a job to sit in.
# Nothing downstream reads the artifacts, so the cost was pure: ~40 minutes of
# Actions time a week, which now bills, since the repo is private.
#
# The capability is kept, not deleted: workflow_dispatch still runs it, so the
# moment the transport is solved (docs/DATA_PROVIDERS.md lists the relay
# options — a licensed aggregator, or this same collector run from a
# residential connection) this becomes a one-line change back. What we do NOT
# do is fight the bot protection; that posture is unchanged.

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "PrizePicks league names to snapshot (space-separated)"
        required: false
        default: "NFL CFB"

concurrency:
  group: collect-pp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot pick'em board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot PrizePicks board
        run: |
          python scripts/collect_prizepicks.py \
            --out artifacts/pp \
            --leagues ${{ github.event.inputs.leagues || 'NFL CFB' }}

      - name: Upload snapshot (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pp-board-${{ github.run_id }}
          path: |
            artifacts/pp/*.parquet
            artifacts/pp/raw/*.json
          if-no-files-found: warn
          retention-days: 30
