name: Live slate

# The daily loop: on game days, grade yesterday's slate into the record chain
# (with Sim Check + record cards), fit the model on committed history, pull the
# current board from The Odds API, and produce a staked slate of recommended
# bets plus the shareable model cards — all persisted as a PRIVATE Actions
# artifact (the slate is derived from paid odds, so it never lands in the
# public repo). Off-season runs find an empty board and succeed.
#
# Read the slate from the run's artifact (or the job log). This does not place
# bets — a human acts on it. Tune the cron to the real game-day windows.

on:
  schedule:
    # Daily windows (UTC): the summer leagues (MLB/WNBA) play every night, and
    # 16:00 + 22:00 still bracket football's afternoon/evening kickoffs on
    # game days. Off nights find an empty board and succeed cheaply.
    - cron: "0 16,22 * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to run (space-separated)"
        required: false
        default: "nfl ncaaf mlb wnba"
      min_edge:
        description: "Minimum edge to bet"
        required: false
        default: "0.02"
      bankroll:
        description: "Bankroll for stake sizing"
        required: false
        default: "100"
      demo:
        description: "Render demo cards from a historical week instead of the live board"
        required: false
        default: "false"
      carousel:
        description: "Stamp matchup cards with n/total slide badges (post as one thread)"
        required: false
        default: "false"

concurrency:
  group: live-slate
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # download previous runs' slate artifacts for the yesterday record

jobs:
  slate:
    name: build staked slate
    runs-on: ubuntu-latest
    # Mail secrets surfaced as env so the email steps can be skipped cleanly when
    # they are not configured (a step `if:` cannot read `secrets` directly).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ---- yesterday's record, Sim Check cards, and the season chain ----------
      # Runs BEFORE the slate build so today's model cards can carry the season
      # record line, and the Sim Check cards (yesterday's results on the pregame
      # distributions) land in the same artifact. Both best-effort: grading
      # trouble never blocks the slate or its email. Previous slates live only
      # in private run artifacts (paid-odds data never lands in the public
      # repo); grading uses the free schedule feeds (nflverse; CFBD when
      # CFBD_API_KEY is set).
      - name: Fetch previous slates
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous
          for id in $(gh run list --workflow live-slate.yml --status success \
              --limit 6 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --dir "artifacts/previous/$id" || true
          done

      - name: Grade yesterday's slates
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          for league in ${{ github.event.inputs.leagues || 'nfl ncaaf mlb wnba' }}; do
            python scripts/grade_yesterday.py \
              --prev-dir artifacts/previous --out-dir artifacts/slate \
              --league "${league}" || true
          done

      # ---- the freshest FantasyPros projections, for the prop slate -----------
      # Best-effort: with no FP artifact banked yet, the slate simply prices
      # game markets alone.
      - name: Fetch FantasyPros projections
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/fp
          id=$(gh run list --workflow collect-fantasypros.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then
            gh run download "$id" --dir artifacts/fp || true
          fi
          # The freshest injuries snapshot (daily cadence) — the intel layer's
          # veto signals read it at bet time.
          inj_id=$(gh run list --workflow collect-injuries.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$inj_id" ]; then
            gh run download "$inj_id" --dir artifacts/fp || true
          fi

      # Demo mode: cards for a real historical week (genuine closing lines from
      # the committed schedules) through the same artifact the app reads — a
      # look-and-feel preview with no odds spend and nothing for the grader.
      - name: Render demo cards (historical week)
        if: github.event.inputs.demo == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/render_demo_cards.py \
            --league nfl --data datasets/nfl --season 2025 --week 10 \
            --out artifacts/slate --max-games 6
          python scripts/render_demo_cards.py \
            --league ncaaf --data datasets/ncaaf --season 2024 --week 10 \
            --teams "Penn State,Michigan,Georgia,Miami,Tennessee,Arkansas" \
            --out artifacts/slate --max-games 6

      - name: Build slates
        if: github.event.inputs.demo != 'true'
        env:
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
          # NCAAF card identity (school abbreviations + colors) fetches the
          # CFBD teams table at render time — same key the grading step uses.
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          FP_FILE=$(ls -t artifacts/fp/**/fp_projections_*.parquet 2>/dev/null | head -1 || true)
          INJ_FILE=$(ls -t artifacts/fp/**/fp_injuries_*.parquet 2>/dev/null | head -1 || true)
          for league in ${{ github.event.inputs.leagues || 'nfl ncaaf mlb wnba' }}; do
            echo "::group::${league} slate"
            EXTRA=""
            if [ "${league}" = "nfl" ] && [ -n "$FP_FILE" ]; then
              EXTRA="--fp-projections $FP_FILE"
            fi
            if [ "${league}" = "nfl" ] && [ -n "$INJ_FILE" ]; then
              EXTRA="$EXTRA --injuries-file $INJ_FILE"
            fi
            if [ "${{ github.event.inputs.carousel || 'false' }}" = "true" ]; then
              EXTRA="$EXTRA --carousel"
            fi
            python scripts/run_live_slate.py \
              --league "${league}" \
              --data "datasets/${league}" \
              --min-edge ${{ github.event.inputs.min_edge || '0.02' }} \
              --bankroll ${{ github.event.inputs.bankroll || '100' }} \
              --out artifacts/slate $EXTRA
            echo "::endgroup::"
          done

      # ---- the optimal DK lineup (DFS surface) --------------------------------
      # Needs both a DK salary snapshot and an FP projections snapshot; missing
      # either just skips the lineup. The lineup parquet + card land in the same
      # private artifact (DK salaries are collected data — never public repo).
      - name: Fetch DraftKings salaries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/dk
          id=$(gh run list --workflow collect-dk-salaries.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then
            gh run download "$id" --dir artifacts/dk || true
          fi

      - name: Build DFS lineups
        continue-on-error: true
        run: |
          FP_FILE=$(ls -t artifacts/fp/**/fp_projections_*.parquet 2>/dev/null | head -1 || true)
          for league in ${{ github.event.inputs.leagues || 'nfl ncaaf mlb wnba' }}; do
            DK_FILE=$(ls -t artifacts/dk/**/dk_salaries_${league}_*.parquet 2>/dev/null | head -1 || true)
            if [ -n "$FP_FILE" ] && [ -n "$DK_FILE" ]; then
              python scripts/build_dfs_lineup.py \
                --salaries "$DK_FILE" --fp "$FP_FILE" \
                --out artifacts/slate --league "${league}" || true
            else
              echo "${league}: missing DK salaries or FP projections; skipping DFS lineup"
            fi
          done

      - name: Upload slates (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: slate-${{ github.run_id }}
          path: |
            artifacts/slate/*.parquet
            artifacts/slate/*.xlsx
            artifacts/slate/*.png
            artifacts/slate/*.md
          if-no-files-found: warn
          retention-days: 60

      # ---- email delivery (optional) ------------------------------------------
      # Sends the day's plays to MAIL_TO after the artifact is safely uploaded.
      # Skipped entirely until the mail secrets are configured — see
      # docs/LAUNCH.md "Email delivery". The recipient lives in a secret (never
      # in this public file), and the mail carries paid-odds-derived data, so it
      # must go to a private inbox.
      - name: Render slate email
        if: env.MAIL_USERNAME != '' && env.MAIL_TO != '' && github.event.inputs.demo != 'true'
        id: email
        run: |
          python scripts/render_slate_email.py \
            --slate-dir artifacts/slate --out-dir artifacts/email --league nfl
          echo "subject=$(cat artifacts/email/subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Email the slate
        if: env.MAIL_USERNAME != '' && env.MAIL_TO != '' && github.event.inputs.demo != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Velocity <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://artifacts/email/slate_email.html
          attachments: artifacts/slate/*.xlsx
