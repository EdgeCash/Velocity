name: Refresh datasets (current season)

# The live slate fits its ratings from the committed datasets/ files; this job
# tops them up with the current season's played games every week so the model
# tracks each season as it happens — daily, because the summer leagues (MLB,
# WNBA; free keyless feeds) play every night. Free feeds only (nflverse;
# CFBD needs the CFBD_API_KEY secret) — datasets/ carries no paid data, so
# committing it is fine (it's the whole point).
#
# The push goes straight to the branch the run checked out (the default
# branch on schedule). If branch protection blocks the github-actions bot,
# either allow it to bypass or convert the push step to open a PR instead.
#
# THIS JOB CHECKS ITSELF, because nothing downstream will. A push made with
# GITHUB_TOKEN deliberately does not trigger workflows, so a refresh that
# breaks the repo lands on main with NO CI run at all and stays red until an
# unrelated PR trips over it — which is exactly what happened on 2026-09-16
# (fd1c4f6 moved datasets/ and left velocity/eval/ladders.py, a cache OF those
# datasets, behind). So the job now regenerates what it invalidates and runs
# the suite before it writes anything.

on:
  schedule:
    - cron: "29 9 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (default: inferred from today)"
        required: false
      league:
        description: "League to refresh (nfl, ncaaf, mlb, wnba, both = football, all). Football only by default — docs/LAUNCH.md 'Football only'."
        required: false
        default: "both"
      mlb_pitching:
        description: "One-off: backfill the MLB starters dataset from statsapi box scores"
        required: false
        default: "false"
      inseason_seasons:
        description: "One-off: backfill MLB + WNBA games for this inclusive season range (e.g. '2024 2026')"
        required: false
      ncaaf_pbp_seasons:
        description: "One-off: backfill NCAAF play-by-play for this inclusive season range (e.g. '2015 2024') instead of the weekly refresh"
        required: false
      cfbd_lines_years:
        description: "One-off: pull NCAAF games+closing lines for this year range (e.g. '2025' or '2015-2025') into games_lines.parquet"
        required: false
      cfbd_sp_years:
        description: "One-off: pull SP+ season ratings for this year range (e.g. '2014-2025') into sp_ratings.parquet"
        required: false

concurrency:
  group: refresh-datasets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: refresh current-season rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Dev extras, not runtime-only: this job verifies itself before pushing,
      # which needs ruff, mypy and pytest.
      - name: Install (with dev extras, for the pre-push check)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Refresh datasets
        if: ${{ github.event.inputs.ncaaf_pbp_seasons == '' && github.event.inputs.inseason_seasons == '' && github.event.inputs.mlb_pitching != 'true' && github.event.inputs.cfbd_lines_years == '' && github.event.inputs.cfbd_sp_years == '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          ARGS="--league ${{ github.event.inputs.league || 'both' }}"
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          python scripts/refresh_datasets.py $ARGS

      - name: Backfill MLB starters
        if: ${{ github.event.inputs.mlb_pitching == 'true' }}
        run: python scripts/build_mlb_pitching.py

      - name: Backfill MLB + WNBA games
        if: ${{ github.event.inputs.inseason_seasons != '' }}
        run: |
          python scripts/build_inseason_datasets.py \
            --seasons ${{ github.event.inputs.inseason_seasons }}

      - name: Backfill NCAAF play-by-play
        if: ${{ github.event.inputs.ncaaf_pbp_seasons != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/build_ncaaf_pbp_datasets.py \
            --seasons ${{ github.event.inputs.ncaaf_pbp_seasons }}

      - name: Pull NCAAF closing lines (CFBD)
        if: ${{ github.event.inputs.cfbd_lines_years != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/pull_cfbd_lines.py \
            --years ${{ github.event.inputs.cfbd_lines_years }}

      - name: Pull SP+ season ratings (CFBD)
        if: ${{ github.event.inputs.cfbd_sp_years != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/pull_cfbd_sp.py \
            --years ${{ github.event.inputs.cfbd_sp_years }}

      - name: Did the data actually move?
        id: moved
        run: |
          if [ -z "$(git status --porcelain datasets/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "datasets unchanged — nothing to regenerate, verify or commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain datasets/
          fi

      # OFFSET_BIAS is a cache of datasets/, and `git add datasets/` never
      # touched it. Regenerating here is what stops the cache going stale the
      # moment the data grows; --write is a no-op when it is already current.
      - name: Regenerate the tables derived from datasets/
        if: steps.moved.outputs.changed == 'true'
        run: python scripts/calibrate_ladders.py --write

      # The gate this job was missing. A red suite fails the run and pushes
      # NOTHING, so a breaking refresh costs a failed job rather than a broken
      # main that nobody is told about.
      - name: Verify before pushing
        if: steps.moved.outputs.changed == 'true'
        run: |
          ruff check .
          mypy
          pytest -q

      - name: Commit refreshed datasets
        if: steps.moved.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Both, always: committing the data without the table it feeds is
          # the exact shape of the 2026-09-16 breakage.
          git add datasets/ velocity/eval/ladders.py
          git commit -m "Data: refresh current-season dataset rows"
          # Rebase before pushing: a merge landing mid-run otherwise rejects
          # the push and throws away the whole fetch (it happened).
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
