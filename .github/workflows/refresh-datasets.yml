name: Refresh datasets (current season)

# The live slate fits its ratings from the committed datasets/ files; this job
# tops them up with the current season's played games every week so the model
# tracks each season as it happens — daily, because the summer leagues (MLB,
# WNBA; free keyless feeds) play every night. Free feeds only (nflverse;
# CFBD needs the CFBD_API_KEY secret) — datasets/ carries no paid data, so
# committing it to the public repo is fine (it's the whole point).
#
# The push goes straight to the branch the run checked out (the default
# branch on schedule). If branch protection blocks the github-actions bot,
# either allow it to bypass or convert the push step to open a PR instead.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year (default: inferred from today)"
        required: false
      league:
        description: "League to refresh (nfl, ncaaf, mlb, wnba, both = football, all)"
        required: false
        default: "all"
      mlb_pitching:
        description: "One-off: backfill the MLB starters dataset from statsapi box scores"
        required: false
        default: "false"
      inseason_seasons:
        description: "One-off: backfill MLB + WNBA games for this inclusive season range (e.g. '2024 2026')"
        required: false
      ncaaf_pbp_seasons:
        description: "One-off: backfill NCAAF play-by-play for this inclusive season range (e.g. '2015 2024') instead of the weekly refresh"
        required: false

concurrency:
  group: refresh-datasets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: refresh current-season rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh datasets
        if: ${{ github.event.inputs.ncaaf_pbp_seasons == '' && github.event.inputs.inseason_seasons == '' && github.event.inputs.mlb_pitching != 'true' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          ARGS="--league ${{ github.event.inputs.league || 'all' }}"
          if [ -n "${{ github.event.inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ github.event.inputs.season }}"
          fi
          python scripts/refresh_datasets.py $ARGS

      - name: Backfill MLB starters
        if: ${{ github.event.inputs.mlb_pitching == 'true' }}
        run: python scripts/build_mlb_pitching.py

      - name: Backfill MLB + WNBA games
        if: ${{ github.event.inputs.inseason_seasons != '' }}
        run: |
          python scripts/build_inseason_datasets.py \
            --seasons ${{ github.event.inputs.inseason_seasons }}

      - name: Backfill NCAAF play-by-play
        if: ${{ github.event.inputs.ncaaf_pbp_seasons != '' }}
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python scripts/build_ncaaf_pbp_datasets.py \
            --seasons ${{ github.event.inputs.ncaaf_pbp_seasons }}

      - name: Commit refreshed datasets
        run: |
          if git diff --quiet -- datasets/ && [ -z "$(git status --porcelain datasets/)" ]; then
            echo "datasets unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/
          git commit -m "Data: refresh current-season dataset rows"
          git push
