name: Live slate (MLB)

# MLB plays a full slate almost every day, so it gets its own daily schedule
# rather than riding the football (Thu/Sat/Sun/Mon) windows. It fits no committed
# dataset — the model is simulated from lineups — so there is no --data. The staked
# slate is written to a PRIVATE Actions artifact (derived from paid odds; never in
# the public repo). Off-day/empty boards find nothing and succeed with an empty
# slate. This does not place bets — a human acts on it.

on:
  schedule:
    # Two daily info windows, in Central time (CDT, UTC-5, in effect all MLB
    # season): 09:00 CT (14:00 UTC) catches the morning board, and 16:00 CT
    # (21:00 UTC) runs after evening-game lineups and props post.
    - cron: "0 14,21 * * *"
  workflow_dispatch:
    inputs:
      min_edge:
        description: "Minimum edge to bet"
        required: false
        default: "0.02"
      bankroll:
        description: "Bankroll for stake sizing"
        required: false
        default: "100"
      n_sims:
        description: "Monte Carlo simulations per game"
        required: false
        default: "10000"

concurrency:
  group: live-slate-mlb
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slate:
    name: build staked MLB slate
    runs-on: ubuntu-latest
    # Mail secrets surfaced as env so the email steps can be skipped cleanly when
    # they are not configured (a step `if:` cannot read `secrets` directly).
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build MLB slate
        env:
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
        run: |
          python scripts/run_live_slate.py \
            --league mlb \
            --n-sims ${{ github.event.inputs.n_sims || '10000' }} \
            --min-edge ${{ github.event.inputs.min_edge || '0.02' }} \
            --bankroll ${{ github.event.inputs.bankroll || '100' }} \
            --out artifacts/slate

      - name: Upload slate (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: slate-mlb-${{ github.run_id }}
          path: |
            artifacts/slate/*.parquet
            artifacts/slate/*.xlsx
            artifacts/slate/*.html
          if-no-files-found: warn
          retention-days: 60

      # ---- email delivery (optional) ------------------------------------------
      # Sends the day's plays (game markets, props, parlays) to MAIL_TO after the
      # artifact is safely uploaded. Skipped entirely until the mail secrets are
      # configured — see docs/LAUNCH.md "Email delivery". The recipient lives in a
      # secret (never in this public file), and the mail carries paid-odds-derived
      # data, so it must go to a private inbox.
      - name: Render slate email
        if: env.MAIL_USERNAME != '' && env.MAIL_TO != ''
        id: email
        run: |
          python scripts/render_slate_email.py \
            --slate-dir artifacts/slate --out-dir artifacts/email --league mlb
          echo "subject=$(cat artifacts/email/subject.txt)" >> "$GITHUB_OUTPUT"

      - name: Email the slate
        if: env.MAIL_USERNAME != '' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Velocity <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.email.outputs.subject }}
          html_body: file://artifacts/email/slate_email.html
          attachments: artifacts/slate/*.xlsx
