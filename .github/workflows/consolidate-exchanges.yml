name: Consolidate exchange archives

# Durability for data that can't be re-pulled (docs/BUILD_EXCHANGES.md E2):
# per-run exchange artifacts expire at 90 days, so this weekly job downloads
# the recent snapshot/candle artifacts PLUS the newest previous archive,
# merges every parquet by kind (scripts/consolidate_exchanges.py), and
# re-uploads one rolling archive artifact carrying the full normalized
# history to date. Raw JSON is not rolled forward — its 90 days in the
# per-run artifacts is the re-normalization window.

on:
  schedule:
    # Weekly, Monday 09:00 UTC (after the NFL week fully settles).
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: consolidate-exchanges
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  consolidate:
    name: roll the exchange archive forward
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download recent exchange artifacts + newest archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded
          # All non-expired snapshot/candle artifacts from the last 8 days,
          # plus the single newest previous archive (the rolling history).
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name, .created_at] | @tsv' \
            > all_artifacts.tsv
          CUTOFF=$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)
          awk -F'\t' -v c="$CUTOFF" \
            '($2 ~ /^exchanges-[0-9]+$/ || $2 ~ /^kalshi-candles-[0-9]+$/) && $3 >= c {print $1}' \
            all_artifacts.tsv > recent_ids.txt
          awk -F'\t' '$2 ~ /^exchanges-archive-/ {print $1 "\t" $3}' all_artifacts.tsv \
            | sort -t$'\t' -k2 -r | head -1 | cut -f1 >> recent_ids.txt
          echo "downloading $(wc -l < recent_ids.txt) artifacts"
          while read -r id; do
            [ -n "$id" ] || continue
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "art_$id.zip"
            unzip -oq "art_$id.zip" -d "downloaded/$id" || echo "skip corrupt artifact $id"
            rm -f "art_$id.zip"
          done < recent_ids.txt

      - name: Consolidate parquet by kind
        run: python scripts/consolidate_exchanges.py --in downloaded --out consolidated

      - name: Upload rolling archive (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: exchanges-archive-${{ github.run_id }}
          path: consolidated/
          if-no-files-found: warn
          retention-days: 90
