name: Model drift check

# Biweekly regression test — DETECTION, never promotion. Re-runs the
# walk-forward gates and compares to the committed baseline
# (datasets/baselines/model_drift.json). A red run means a metric moved
# beyond tolerance and a human should look; it never refits or ships
# anything. Two weeks of live results is noise, so nothing here is allowed
# to "learn" from it (docs/PUBLISH_GATE.md).

on:
  schedule:
    # 06:00 UTC on the 1st and 15th.
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

concurrency:
  group: model-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    name: walk-forward regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Fails the job when a metric drifts past tolerance — that is the alarm.
      - name: Check for drift
        run: python scripts/model_drift_check.py
