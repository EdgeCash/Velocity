name: Collect player-prop lines

# Snapshots NFL + NCAAF player props (pass/rush/receiving yards, receptions,
# pass TDs, anytime TD) PLUS the team-total derivative into an Actions
# artifact — the soft-market CLV archive the prop backtest replays, and the
# posted team-total closes the min_team_total_disagreement gate calibrates
# against (docs/BACKTEST_NCAAF.md addendum). All are per-event "additional"
# markets served from one /events/{id}/odds call each: cost ≈ events ×
# markets × regions. An NFL week (~16 events × 7 markets) is ~110 credits; a
# full NCAAF Saturday board is the big one (~60 events → ~420), so twice
# daily lands well under the 100k/month budget. Raw payloads are banked
# verbatim alongside the normalized parquets; empty boards succeed. Never
# commits — paid odds must not land in git, whose history is permanent.
#
# Manual dispatch doubles as the THE_ODDS_API prop-endpoint verification.

on:
  schedule:
    # ALIGNED TO live-slate.yml's WINDOWS, 34 minutes ahead of each.
    #
    # Props are a core market (docs/DECISIONS.md D1), and the old twice-daily
    # pair kept missing the bar. Measured 2026-09-20: the 15:19 cron actually
    # started at 18:12 — inside GitHub's normal 1h48-3h00 scheduled-run delay
    # — so by the 22:51 slate the newest board was 279 minutes old against a
    # 75-minute freshness bar, and the entire props surface was absent from
    # that slate.
    #
    # Raising the bar was the wrong fix and is explicitly refused: a
    # four-hour-old prop line is not a price. The right fix is to collect
    # nearer each slate, and the way to do that under a delay you cannot
    # control is to ride the SAME delay. Both workflows queue on the same
    # platform under the same conditions, so a prop cron 34 minutes before a
    # slate cron tends to land 34 minutes before that slate RUNS — inside the
    # 75-minute bar — rather than at a fixed wall-clock time the slate has
    # long since drifted away from.
    #
    # :19 keeps this workflow's minute from the map (docs/LAUNCH.md) and
    # stays before live-slate's :53, which tests/test_workflow_schedules.py
    # requires of everything the slate reads.
    #
    # Seventeen runs a week against fourteen: about 28k Odds API credits a
    # month where the old pair spent 23k, against a 100k allowance. Fresh
    # prop data is worth more than the 5k (docs/DECISIONS.md D1).
    - cron: "19 11,14,17,20,23 * * 6"   # Saturday: the college slate
    - cron: "19 11,14,17,20 * * 0"      # Sunday: the NFL slate
    - cron: "19 17,20 * * 1,4,5"        # Mon/Thu/Fri: prime time, the weeknight card
    - cron: "19 17 * * 2,3"             # Tue/Wed: the week's opening board
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to snapshot (space-separated)"
        required: false
        default: "nfl ncaaf mlb"
      markets:
        description: "Prop market keys (comma-separated The Odds API keys)"
        required: false

concurrency:
  group: collect-football-props
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot football props
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot props
        env:
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
        run: |
          # Football only (docs/LAUNCH.md "Football only") — and MLB stays in
          # this list, like collect-odds.yml's, ONLY until the ledger's open
          # MLB prop rows settle: a prop graded without its close is a prop
          # with no CLV. Drop it once no open MLB row remains, together with
          # the mlb entry in LEAGUE_PROP_MARKETS (the schedule and the config
          # are pinned to agree — tests/test_collect_football_props.py).
          ARGS="--out artifacts/props --leagues '${{ github.event.inputs.leagues || 'nfl ncaaf mlb' }}'"
          if [ -n "${{ github.event.inputs.markets }}" ]; then
            ARGS="$ARGS --markets ${{ github.event.inputs.markets }}"
          fi
          eval python scripts/collect_football_props.py $ARGS

      - name: Upload props (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: football-props-${{ github.run_id }}
          path: |
            artifacts/props/*.parquet
            artifacts/props/raw/*.json
          if-no-files-found: warn
          retention-days: 60
