name: Collect player-prop lines

# Snapshots NFL + NCAAF player props (pass/rush/receiving yards, receptions,
# pass TDs, anytime TD) PLUS the team-total derivative into a PRIVATE Actions
# artifact — the soft-market CLV archive the prop backtest replays, and the
# posted team-total closes the min_team_total_disagreement gate calibrates
# against (docs/BACKTEST_NCAAF.md addendum). All are per-event "additional"
# markets served from one /events/{id}/odds call each: cost ≈ events ×
# markets × regions. An NFL week (~16 events × 7 markets) is ~110 credits; a
# full NCAAF Saturday board is the big one (~60 events → ~420), so twice
# daily lands well under the 100k/month budget. Raw payloads are banked
# verbatim alongside the normalized parquets; empty boards succeed. Never
# commits — the repo is public and paid odds must not land in it.
#
# Manual dispatch doubles as the THE_ODDS_API prop-endpoint verification.

on:
  schedule:
    # Twice daily (UTC): mid-morning ET for overnight moves, early evening ET
    # after injury reports land. Tighten toward kickoff if closer-to-close
    # prop CLV is wanted.
    - cron: "0 15,22 * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to snapshot (space-separated)"
        required: false
        default: "nfl ncaaf mlb nhl"
      markets:
        description: "Prop market keys (comma-separated The Odds API keys)"
        required: false

concurrency:
  group: collect-football-props
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot football props
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot props
        env:
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
        run: |
          ARGS="--out artifacts/props --leagues '${{ github.event.inputs.leagues || 'nfl ncaaf mlb nhl' }}'"
          if [ -n "${{ github.event.inputs.markets }}" ]; then
            ARGS="$ARGS --markets ${{ github.event.inputs.markets }}"
          fi
          eval python scripts/collect_football_props.py $ARGS

      - name: Upload props (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: football-props-${{ github.run_id }}
          path: |
            artifacts/props/*.parquet
            artifacts/props/raw/*.json
          if-no-files-found: warn
          retention-days: 60
