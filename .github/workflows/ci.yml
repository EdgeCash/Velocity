name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: lint · type · test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff (lint + import order)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy

      - name: Pytest (offline suite)
        run: pytest -q

      # The hub's joins are JavaScript, and they are the kind of code that
      # fails QUIETLY: a team-name match that misses drops a league's live
      # scores while the board still looks fine, and a box-score parser that
      # guesses column names mislabels a row of numbers rather than erroring.
      # node's own runner, no dependencies — it needs neither `npm ci` nor a
      # browser, so it costs seconds.
      - name: Node (hub join + formatter tests)
        if: matrix.python-version == '3.12'
        run: node --test "site/tests/**/*.test.mjs"
