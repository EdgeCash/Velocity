name: DFS slate

# The DFS surfaces on their own clock, because WHEN they run is worth more
# than any model term in them.
#
# Backtested on 263 harvested DK classic boards (docs/DFS_FORMATS.md): built
# before statsapi posts the batting orders, the optimal lineup's edge over
# DK's own pricing is +3.2 DK points at t = 1.55 — indistinguishable from
# zero, because three of its ten players never leave the bench. Built from
# the confirmed card it is +13.1 at t = 5.77. Same projections, same
# optimizer; only the hour differs.
#
# So this runs in the windows where the cards are posted and the slates have
# not locked, rather than riding the 16:00/22:00 betting-slate cadence. Every
# input is free and unauthenticated (DK's lobby, statsapi), so extra runs
# cost nothing but minutes. Output is an Actions artifact — DK salaries are
# collected data and never land in git.

on:
  schedule:
    # UTC, football only (docs/LAUNCH.md "Football only"). Every window has
    # to sit AFTER the inactives and BEFORE the lock it serves, and GitHub
    # starts a scheduled run 1h48–3h00 late (docs/LAUNCH.md "What the
    # schedule really does"), so each cron below is written about two and a
    # half hours before the moment it is meant to run. The NFL posts
    # inactives 90 minutes before kickoff: 15:30Z for the early slate,
    # 18:35Z late, 22:50Z Sunday night, 22:45Z Monday and Thursday. The
    # early slate is the one the delay can beat — a 13:41 cron starts
    # 15:29–16:41Z against a 17:00Z lock, so the early board sometimes
    # builds before the inactives post; the late and night boards do not
    # have that problem. College boards lock at kickoff with no inactives
    # list, so those windows only need to land before the lock.
    #
    # :41, per the map in docs/LAUNCH.md, and before live-slate's :53 on
    # purpose: live-slate's "Fetch the latest DFS entries" step downloads
    # this workflow's newest SUCCESSFUL run, and starting first is what
    # makes that step fetch today's board rather than the previous window's.
    - cron: "41 11,14,18 * * 6"   # Sat: DK's college main (16:00Z), afternoon (19:30Z), night (23:00Z) locks
    - cron: "41 13,16,20 * * 0"   # Sun: NFL early (17:00Z), late (20:05Z), SNF (00:20Z) locks
    - cron: "41 20 * * 1,4"       # Mon/Thu: the MNF/TNF showdown (00:15Z lock)
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to build (space-separated)"
        required: false
        default: "nfl ncaaf"

concurrency:
  group: dfs-slate
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # download the FantasyPros artifact for the football boards

jobs:
  dfs:
    name: build DFS entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # A fresh snapshot rather than the morning one: salaries move, and the
      # probable-pitcher and lineup flags on the board are game-day state.
      - name: Snapshot DraftKings boards
        run: |
          python scripts/collect_dk_salaries.py --out artifacts/dk_salaries \
            --leagues "${{ github.event.inputs.leagues || 'nfl ncaaf' }}"

      # Football prices from the FantasyPros consensus; MLB from the free
      # statsapi season stats (the FP public tier serves no MLB players).
      # The live run's game projections (mu_home / mu_away) — the DST
      # points-allowed bracket prices off the same sim the board did.
      - name: Fetch the latest live-slate projections
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous
          id=$(gh run list --workflow live-slate.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$id" ] && gh run download "$id" --dir "artifacts/previous/$id" || true

      - name: Fetch FantasyPros projections
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/fp
          id=$(gh run list --workflow collect-fantasypros.yml --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$id" ]; then
            gh run download "$id" --dir artifacts/fp || true
          fi

      - name: Build DFS entries
        run: |
          FP_FILE=$(ls -t artifacts/fp/**/fp_projections_*.parquet 2>/dev/null | head -1 || true)
          MLB_STATS=""
          if [[ " ${{ github.event.inputs.leagues || 'nfl ncaaf' }} " == *" mlb "* ]]; then
            python scripts/collect_mlb_player_stats.py --out artifacts/mlbstats || true
            MLB_STATS=$(ls -t artifacts/mlbstats/mlb_player_stats_*.parquet 2>/dev/null | head -1 || true)
          fi
          for league in ${{ github.event.inputs.leagues || 'nfl ncaaf' }}; do
            echo "::group::${league} DFS"
            DK_FILE=$(ls -t artifacts/dk_salaries/dk_salaries_${league}_*.parquet 2>/dev/null | head -1 || true)
            PROJ_FILE="$FP_FILE"
            if [ "${league}" = "mlb" ]; then PROJ_FILE="$MLB_STATS"; fi
            # The WNBA prices from its own banked box scores: no projection
            # service serves the league for free, so the committed player box
            # IS the projection input (velocity/models/dfs_wnba.py).
            if [ "${league}" = "wnba" ]; then PROJ_FILE="datasets/wnba/player_box.parquet"; fi
            # College too: FantasyPros serves no college players at all, so the
            # board never built (velocity/models/dfs_ncaaf.py).
            if [ "${league}" = "ncaaf" ]; then PROJ_FILE="datasets/ncaaf/player_games.parquet"; fi
            if [ -n "$PROJ_FILE" ] && [ -n "$DK_FILE" ]; then
              # Tournaments pay the right tail of a huge field, so the DFS
              # unit is a diversified, stacked PORTFOLIO rather than one
              # cash-optimal roster (docs/EDGE_RESEARCH.md §5).
              python scripts/build_dfs_lineup.py \
                --salaries "$DK_FILE" --fp "$PROJ_FILE" --gpp 20 \
                --projections-dir artifacts/previous \
                --out artifacts/slate --league "${league}" || true
            else
              echo "${league}: missing DK salaries or projections; skipping"
            fi
            # DK's salary-free formats ride their own artifact — every
            # draftable on those boards is priceless (docs/DFS_FORMATS.md).
            TIER_FILE=$(ls -t artifacts/dk_salaries/dk_tiered_${league}_*.parquet 2>/dev/null | head -1 || true)
            if [ -n "$TIER_FILE" ]; then
              PYTHONPATH=scripts python scripts/build_dfs_tiered.py \
                --tiered "$TIER_FILE" --league "${league}" \
                ${PROJ_FILE:+--fp "$PROJ_FILE"} --out artifacts/slate || true
            fi
            echo "::endgroup::"
          done

      # The receipt. Every other surface states what it scored against a
      # settled number; the DFS boards were the one that went out six times a
      # day and was never once graded. Actuals are free and keyless (statsapi
      # boxscores, the nflverse weekly release), so this costs only minutes.
      - name: Grade yesterday's DFS entries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/dfs_prev
          # Yesterday's boards live in yesterday's runs, and this job runs six
          # times a day — a fortnight of runs is a couple of days of boards.
          for id in $(gh run list --workflow dfs-slate.yml --status success \
              --limit 14 --json databaseId --jq '.[].databaseId'); do
            gh run download "$id" --dir "artifacts/dfs_prev/$id" || true
          done
          for league in ${{ github.event.inputs.leagues || 'nfl ncaaf' }}; do
            echo "::group::grade ${league} DFS"
            python scripts/grade_dfs.py --prev-dir artifacts/dfs_prev \
              --out-dir artifacts/slate --league "${league}" || true
            echo "::endgroup::"
          done

      - name: Build the MLB home-run board
        if: contains(github.event.inputs.leagues || 'nfl ncaaf', 'mlb')
        continue-on-error: true
        run: |
          python scripts/collect_mlb_statcast.py --out artifacts/statcast || true
          STATCAST=$(ls -t artifacts/statcast/*.parquet 2>/dev/null | head -1 || true)
          # No --lineups here: this job does not download the BettingPros
          # artifact, so the flag would resolve empty on every run and pass
          # nothing — which is exactly how --statcast hid in live-slate.yml for
          # months. Wire the bp download in first, then add the flag.
          PYTHONPATH=scripts python scripts/build_hr_board.py \
            ${STATCAST:+--statcast "$STATCAST"} --out artifacts/slate || true

      - name: Upload DFS entries (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dfs-slate-${{ github.run_id }}
          path: |
            artifacts/slate/*.parquet
            artifacts/slate/*.png
            artifacts/slate/*.md
            artifacts/dk_salaries/*.parquet
          if-no-files-found: warn
          retention-days: 60
