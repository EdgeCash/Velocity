name: Walk-forward MLB prop backtest (CLV scorecard)

# Turns the banked PROP CLV archive into the prop acceptance number for #23. It
# downloads the private hist-props-* artifact produced by the backfill
# (collect-historical-props.yml), replays it through the point-in-time model day by
# day, prices each day's entry prop board, attaches the closing board, and uploads
# the prop scorecard (CLV by market) plus the per-bet ledger. No Odds API credits are
# spent — the archive is all it needs (StatsAPI season-to-date stats are free).
#
# This is the GRADE-FREE CLV read: box scores (needed for win/loss + ROI) are a
# separate layer. The archive is a PRIVATE artifact and never committed; this reads
# it and writes only derived numbers (no raw paid odds) back out as its own artifact.

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated run IDs of the hist-props-* backfill runs to score"
        required: true
        default: "30181389616"
      season:
        description: "Season year for the point-in-time (as-of) stats"
        required: false
        default: "2026"
      n_sims:
        description: "Monte Carlo draws per game (lower = faster; 2000 is plenty for CLV)"
        required: false
        default: "2000"
      grade:
        description: "Fetch box scores + grade win/loss + ROI + calibration (free StatsAPI)"
        type: boolean
        required: false
        default: false
      shrink_sweep:
        description: "Confidence shrinks to compare in one walk, e.g. '1.0,0.7,0.5,0.35' (blank = single run)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read  # download artifacts from the backfill runs

jobs:
  backtest:
    name: score the prop archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download banked prop CLV archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/hist_props
          for rid in $(echo "${{ github.event.inputs.run_ids }}" | tr ',' ' '); do
            echo "downloading hist-props-* from run $rid"
            gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
              --pattern 'hist-props-*' --dir artifacts/hist_props
          done
          echo "archive contents:"
          find artifacts/hist_props -name 'props_*.parquet' | wc -l
          find artifacts/hist_props -name 'props_*.parquet' | head

      - name: Run walk-forward prop backtest
        run: |
          set -o pipefail  # a python crash must fail the job, not be masked by tee
          mkdir -p artifacts/backtest
          extra=""
          if [ "${{ github.event.inputs.grade }}" = "true" ]; then
            extra="$extra --grade"
          fi
          # A shrink sweep compares calibration levels in one walk (no --out ledger);
          # a blank input runs the single walk and persists the ledger.
          if [ -n "${{ github.event.inputs.shrink_sweep }}" ]; then
            extra="$extra --shrink-sweep ${{ github.event.inputs.shrink_sweep }}"
          else
            extra="$extra --out artifacts/backtest/prop_ledger.parquet"
          fi
          python scripts/backtest_props_mlb.py \
            --archive artifacts/hist_props \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --n-sims "${{ github.event.inputs.n_sims || '2000' }}" \
            $extra \
            | tee artifacts/backtest/prop_scorecard.txt

      - name: Upload scorecard + ledger
        uses: actions/upload-artifact@v4
        with:
          name: mlb-prop-backtest-${{ github.run_id }}
          path: |
            artifacts/backtest/prop_scorecard.txt
            artifacts/backtest/prop_ledger.parquet
          if-no-files-found: warn
          retention-days: 90
