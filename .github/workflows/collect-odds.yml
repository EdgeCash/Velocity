name: Collect The Odds API lines

# The Odds API is the feed with real history — the source of the closing-line
# archive for CLV and the market backtest. This snapshots the live board on a
# schedule (cheap: 1 credit per market per region) into an Actions artifact.
# Nothing is committed: paid odds must not land in git, whose history is
# permanent, clonable and mirrored.
#
# Triggering this manually (workflow_dispatch) is also the in-CI verification
# that the THE_ODDS_API secret works — the dev sandbox can't see the secret, so
# this run is where the live client is proven end-to-end.

on:
  schedule:
    # Hourly. Live /odds for 5 leagues × 3 markets ≈ 15 credits/run →
    # ~11k/month, well under the 100k budget. All five slate leagues are
    # snapshotted so every league's plays can be graded against a real
    # close (the CLV loop in grade_yesterday.py).
    # :23 past the hour — see the minute map in docs/LAUNCH.md.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to snapshot (space-separated), e.g. 'nfl ncaaf'"
        required: false
        default: "nfl ncaaf mlb wnba ncaab nhl"
      regions:
        description: "The Odds API regions: 'us', or 'us,eu' to add Pinnacle (doubles the credits per pull)"
        required: false
        default: "us"

concurrency:
  group: collect-odds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot game lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot The Odds API lines
        env:
          THE_ODDS_API: ${{ secrets.THE_ODDS_API }}
        run: |
          python scripts/collect_theoddsapi.py \
            --out artifacts/odds \
            --regions "${{ github.event.inputs.regions || 'us' }}" \
            --leagues ${{ github.event.inputs.leagues || 'nfl ncaaf mlb wnba ncaab nhl' }}

      - name: Upload snapshot (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: odds-lines-${{ github.run_id }}
          # The raw /odds payloads ride along with the parquet: they cost no
          # extra credits (the parquet is normalized from them) and they carry
          # the event metadata the live slate needs to build a board without
          # spending its own call on data this run already bought.
          path: artifacts/odds/
          if-no-files-found: warn
          retention-days: 30
