name: Collect FantasyPros projections

# FantasyPros consensus projections feed the props model as an external prior.
# This snapshots them into an Actions artifact — nothing is committed (paid
# data never lands in git). Because we don't have a pinned FantasyPros schema,
# every run passes --inspect, doubling as the in-CI verification of the
# FP_API_KEY secret and the way we tighten the tolerant normalizer.
#
# --inspect now prints the STAT-KEY CENSUS: every key the feed serves, how many
# players carry a non-zero value for it, and which keys the props model
# actually reads. That is the open question behind the two largest unmapped
# BettingPros prop slugs — rushing-attempts (57 rows) and passing-attempts
# (28) — which are ordinary count props with banked actuals to calibrate
# against, blocked only on whether FantasyPros projects the volume at all.
# FP_API_KEY is a secret the sandbox cannot see, so the answer has to come out
# of this log. It costs no extra request, so it rides the schedule too: read
# the "volume-like keys (the open question)" block of any run.

on:
  schedule:
    # Tuesday is the weekly refresh: consensus projections settle after the
    # previous week finishes, and this is the snapshot the props model treats
    # as its external prior.
    - cron: "37 12 * * 2"
    # ...but Tuesday alone is not enough to run on. The whole NFL weekly
    # surface — player props, the DFS classic and showdown builds, the GPP
    # portfolio and the pick'em board — refuses a season-long (week 0)
    # snapshot, correctly, and takes the previous one otherwise. So a single
    # bad Tuesday leaves every one of them dark until the *following* Tuesday,
    # which lands after Sunday's games: exactly what happened in Week 1, when
    # the Tuesday run predated the week resolver's fix and answered week 0.
    # Thursday, Saturday and Sunday mornings give the week three more chances
    # to be right before it matters, and cost one small request each.
    - cron: "37 12 * * 4"
    - cron: "37 12 * * 6"
    - cron: "37 12 * * 0"
  workflow_dispatch:
    inputs:
      season:
        description: "Projection season"
        required: true
        default: "2026"
      week:
        description: "Week (auto = derive in-season week; 0 = full-season)"
        required: false
        default: "auto"

concurrency:
  group: collect-fp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot projections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Snapshot FantasyPros projections
        env:
          FP_API_KEY: ${{ secrets.FP_API_KEY }}
        run: |
          python scripts/collect_fantasypros.py \
            --season ${{ github.event.inputs.season || '2026' }} \
            --week ${{ github.event.inputs.week || 'auto' }} \
            --out artifacts/fp \
            --inspect

      - name: Upload snapshot (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fp-projections-${{ github.run_id }}
          path: artifacts/fp/*.parquet
          if-no-files-found: warn
          retention-days: 30
