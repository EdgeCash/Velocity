name: Walk-forward MLB backtest (CLV scorecard)

# Turns the banked CLV archive into the season acceptance number for #23. It
# downloads the private hist-odds-* artifacts produced by the backfill
# (collect-historical-odds.yml), replays them through the point-in-time model day
# by day, and uploads the season scorecard (CLV by market + calibration) plus the
# graded per-bet ledger. No Odds API credits are spent — the archive is all it needs
# (StatsAPI finals + season-to-date stats are free).
#
# The archive is a PRIVATE artifact and never committed; this reads it, scores it,
# and writes only derived numbers (no raw paid odds) back out as its own artifact.

on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated run IDs of the hist-odds-* backfill runs to score"
        required: true
        # The full-season 2026 backfill: Jul 1-22, Mar 25-Jun 30, Jul 23-24.
        default: "30143743871,30143906960,30143910926"
      season:
        description: "Season year for the point-in-time (as-of) stats"
        required: false
        default: "2026"
      n_sims:
        description: "Monte Carlo draws per game (lower = faster; 2000 is plenty for CLV)"
        required: false
        default: "2000"

permissions:
  contents: read
  actions: read  # download artifacts from the backfill runs

jobs:
  backtest:
    name: score the archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Download banked CLV archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/hist
          for rid in $(echo "${{ github.event.inputs.run_ids }}" | tr ',' ' '); do
            echo "downloading hist-odds-* from run $rid"
            gh run download "$rid" --repo "$GITHUB_REPOSITORY" \
              --pattern 'hist-odds-*' --dir artifacts/hist
          done
          echo "archive contents:"
          find artifacts/hist -name '*.parquet' | wc -l
          find artifacts/hist -name '*.parquet' | head

      - name: Run walk-forward backtest
        run: |
          set -o pipefail  # a python crash must fail the job, not be masked by tee
          mkdir -p artifacts/backtest
          python scripts/backtest_mlb.py \
            --archive artifacts/hist \
            --season "${{ github.event.inputs.season || '2026' }}" \
            --n-sims "${{ github.event.inputs.n_sims || '2000' }}" \
            --out artifacts/backtest/ledger.parquet \
            | tee artifacts/backtest/scorecard.txt

      - name: Upload scorecard + ledger
        uses: actions/upload-artifact@v4
        with:
          name: mlb-backtest-${{ github.run_id }}
          path: |
            artifacts/backtest/scorecard.txt
            artifacts/backtest/ledger.parquet
          if-no-files-found: warn
          retention-days: 90
